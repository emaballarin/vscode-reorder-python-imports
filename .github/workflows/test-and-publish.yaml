name: Run tests and publish on new tag

on:
    - push

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os:
                    - windows-latest
                    - ubuntu-latest
                    - macos-latest

        name: Test on ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - run: npm ci

            # Compiles and lints via the `pretest` script, then runs the unit
            # tests. These exercise plain node, so no display server is needed.
            - run: npm test

            - name: Check formatting
              if: runner.os == 'Linux'
              run: npm run format:check

            # Packaging has its own failure modes — a bad .vscodeignore, a
            # missing icon, manifest fields vsce rejects — that the tests above
            # cannot see.
            - name: Check that the extension packages
              if: runner.os == 'Linux'
              run: npx vsce package --out /tmp/reorder-python-imports.vsix

    publish:
        name: Publish to the extension marketplace
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version-file: '.nvmrc'
                  cache: 'npm'

            - run: npm ci

            - run: npm run deploy
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
